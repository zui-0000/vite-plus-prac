name: Auto review

# PR が作られたら github-actions[bot] がコメント扱い（COMMENT）のレビューを投稿する。
# 承認（APPROVE）はしないので、マージの可否には影響しない
on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.pulls.createReview({
              ...context.repo,
              pull_number: context.issue.number,
              event: 'COMMENT',
              body: '自動レビュー: PR を受け付けました',
            });
