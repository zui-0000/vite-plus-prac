# ---------------------------------------------------------------------------
# Vite+ がそろえる版。vp migrate が書き換えるので、手で版を変えない
# ---------------------------------------------------------------------------
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# ---------------------------------------------------------------------------
# 依存の入れ方
# ---------------------------------------------------------------------------
# 同じパッケージが複数の版で入っていて、1 つの版で全員の範囲を満たせるなら、その版にまとめる
autoDedupe: true

# ---------------------------------------------------------------------------
# サプライチェーン攻撃への備え
# ---------------------------------------------------------------------------
# 公開から 2 日（2880 分）たっていない版は入れない。自分で書いたので「厳しい」動き（足りなければエラー）になる。
# 止まったら、minimumReleaseAgeExclude には足さず、2 日たった版に入れ直す（vp migrate が足したものも消す）
minimumReleaseAge: 2880

# 前に公開された版より、公開の証明（trusted publishing・provenance）が弱い版は入れない
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
